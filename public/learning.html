<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 학습 - Ringle AI 튜터</title>
    <link href="css/styles.css" rel="stylesheet">
    <style>
        .learning-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .learning-header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 40px 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .lesson-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .lesson-card:hover {
            transform: translateY(-5px);
        }
        
        .lesson-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .lesson-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .lesson-desc {
            color: #666;
            margin-bottom: 20px;
        }
        
        .lesson-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .lesson-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 65%;
            transition: width 0.3s ease;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="learning-container">
        <div class="learning-header">
            <a href="index.html" class="back-button">← 홈으로</a>
            <h1>📚 AI 영어 학습</h1>
            <p>체계적인 학습으로 영어 실력을 향상시켜보세요!</p>
        </div>

        <div class="lesson-grid">
            <div class="lesson-card">
                <div class="lesson-icon">🗣️</div>
                <div class="lesson-title">일상 대화</div>
                <div class="lesson-desc">기본적인 인사말과 일상 대화를 연습합니다</div>
                <button class="lesson-btn" onclick="startLesson('daily')">학습 시작</button>
            </div>
            
            <div class="lesson-card">
                <div class="lesson-icon">💼</div>
                <div class="lesson-title">비즈니스 영어</div>
                <div class="lesson-desc">회의, 프레젠테이션 등 업무 영어를 학습합니다</div>
                <button class="lesson-btn" onclick="startLesson('business')">학습 시작</button>
            </div>
            
            <div class="lesson-card">
                <div class="lesson-icon">✈️</div>
                <div class="lesson-title">여행 영어</div>
                <div class="lesson-desc">여행 시 필요한 표현들을 익힙니다</div>
                <button class="lesson-btn" onclick="startLesson('travel')">학습 시작</button>
            </div>
            
            <div class="lesson-card">
                <div class="lesson-icon">📖</div>
                <div class="lesson-title">문법 연습</div>
                <div class="lesson-desc">핵심 문법 규칙을 체계적으로 학습합니다</div>
                <button class="lesson-btn" onclick="startLesson('grammar')">학습 시작</button>
            </div>
        </div>

        <div class="progress-section">
            <h2>학습 진도</h2>
            <p>전체 진도: 65% 완료</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <span>완료한 레슨: 13개</span>
                <span>남은 레슨: 7개</span>
            </div>
        </div>
    </div>

    <script>
        function startLesson(type) {
            const lessons = {
                'daily': '일상 대화',
                'business': '비즈니스 영어', 
                'travel': '여행 영어',
                'grammar': '문법 연습'
            };
            
            const lessonName = lessons[type];
            
            // Mock 학습 시작 알림
            alert(`🎓 ${lessonName} 학습을 시작합니다!\n\n실제 서비스에서는 다음과 같은 기능이 제공됩니다:\n• AI 튜터와의 맞춤형 학습\n• 발음 교정 및 피드백\n• 진도에 따른 단계별 학습\n• 실시간 퀴즈 및 연습 문제`);
            
            // 학습 시작 로그
            console.log(`${lessonName} 학습 시작됨 - ${new Date().toLocaleString()}`);
            
            // 실제 구현에서는 여기서 학습 화면으로 이동
            // window.location.href = `lesson.html?type=${type}`;
        }

        // 페이지 로드시 멤버십 확인
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                // 멤버십 상태 확인 (API 호출)
                const currentUserId = localStorage.getItem('currentUserId');
                if (!currentUserId) {
                    alert('로그인이 필요합니다.');
                    window.location.href = 'login.html';
                    return;
                }
                const response = await fetch(`/api/v1/users/${currentUserId}/membership_status`);
                const data = await response.json();
                
                if (!data.has_membership) {
                    alert('활성화된 멤버십이 필요합니다. 홈 화면에서 멤버십을 구매해주세요.');
                    window.location.href = 'index.html';
                    return;
                }
                
                const features = data.membership.features;
                if (!features.includes('learning')) {
                    alert('학습 기능을 사용할 수 없는 멤버십입니다.');
                    window.location.href = 'index.html';
                    return;
                }
                
                console.log('학습 기능 사용 가능:', data.membership.name);
                
            } catch (error) {
                console.error('멤버십 확인 실패:', error);
            }
        });
    </script>
</body>
</html>
