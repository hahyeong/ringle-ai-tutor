<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 대화 - Ringle AI 튜터</title>
    <link href="css/styles.css" rel="stylesheet">
    <style>
        /* 대화 화면 전용 스타일 */
        .conversation-container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }
        
        .conversation-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }
        
        .message.ai .message-avatar {
            background: #667eea;
        }
        
        .message.user .message-avatar {
            background: #4CAF50;
        }
        
        .message-content {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 20px;
            position: relative;
        }
        
        .message.ai .message-content {
            background: white;
            border: 1px solid #e0e0e0;
        }
        
        .message.user .message-content {
            background: #4CAF50;
            color: white;
        }
        
        .message-time {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 5px;
        }
        
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .voice-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: #4CAF50;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .voice-button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        .voice-button.recording {
            background: #f44336;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .text-input {
            flex: 1;
            padding: 15px 20px;
            border: 1px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }
        
        .send-button {
            padding: 15px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .send-button:hover {
            background: #5a6fd8;
        }
        
        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .voice-indicator {
            padding: 10px 20px;
            background: #e3f2fd;
            border-radius: 20px;
            margin: 10px 0;
            text-align: center;
            color: #1976d2;
        }
        
        .loading-indicator {
            padding: 15px;
            text-align: center;
            color: #666;
        }
        
        .loading-dots {
            display: inline-block;
        }
        
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(3, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .back-button:hover {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <div class="conversation-container">
        <!-- 헤더 -->
        <div class="conversation-header">
            <a href="index.html" class="back-button">← 홈으로</a>
            <h1>🤖 AI 영어 튜터</h1>
            <p>음성으로 대화해보세요!</p>
        </div>
        
        <!-- 채팅 영역 -->
        <div class="chat-area" id="chatArea">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div>안녕하세요! 저는 Ringle AI 튜터입니다. 영어로 대화를 나눠보세요! 😊</div>
                    <div class="message-time" id="welcomeTime"></div>
                </div>
            </div>
        </div>
        
        <!-- 음성 인식 상태 표시 -->
        <div id="voiceIndicator" class="voice-indicator" style="display: none;">
            🎤 음성을 인식하고 있습니다...
        </div>
        
        <!-- AI 응답 로딩 -->
        <div id="loadingIndicator" class="loading-indicator" style="display: none;">
            <div class="loading-dots">AI가 응답을 생성중입니다</div>
        </div>
        
        <!-- 입력 영역 -->
        <div class="input-area">
            <button id="voiceButton" class="voice-button" title="음성으로 말하기">
                🎤
            </button>
            <input type="text" id="textInput" class="text-input" placeholder="메시지를 입력하거나 음성 버튼을 눌러주세요..." />
            <button id="sendButton" class="send-button">전송</button>
        </div>
    </div>

    <!-- JavaScript 파일들 -->
    <script src="js/api.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/conversation.js"></script>
    
    <script>
        // 페이지 로드시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            console.log('대화 화면 로드됨');
            initConversation();
            
            // 환영 메시지 시간 설정
            document.getElementById('welcomeTime').textContent = new Date().toLocaleTimeString('ko-KR');
        });
    </script>
</body>
</html>
