<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Ringle AI 튜터</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 480px;
            width: 90%;
            border: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .login-subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .user-selection {
            margin-bottom: 30px;
        }

        .refresh-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5b5bd6;
            transform: translateY(-1px);
        }

        .user-option {
            background: #f8f9fa;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .user-option:hover {
            background: #f1f5f9;
            border-color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.1);
        }

        .user-option.selected {
            background: #f1f5f9;
            border-color: #6366f1;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.15);
        }

        .user-name {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
            font-size: 1.1rem;
        }

        .user-email {
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .user-membership {
            color: #6366f1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .login-btn {
            background: #6366f1;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 20px;
        }

        .login-btn:hover:not(:disabled) {
            background: #5b5bd6;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #d1d5db;
        }

        .demo-note {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #92400e;
            text-align: left;
        }

        .demo-note strong {
            color: #78350f;
            display: block;
            margin-bottom: 8px;
        }

        .demo-note ul {
            margin-left: 20px;
            margin-top: 8px;
        }

        .demo-note li {
            margin-bottom: 4px;
        }

        .loading-state {
            padding: 20px;
            color: #6b7280;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #e5e7eb;
            border-top: 2px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            padding: 20px;
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            margin: 10px 0;
        }

        .error-state strong {
            display: block;
            margin-bottom: 8px;
        }

        .error-state code {
            background: #f3f4f6;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .login-container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .login-title {
                font-size: 1.8rem;
            }
            
            .user-option {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🤖</div>
        <h1 class="login-title">Ringle AI 튜터</h1>
        <p class="login-subtitle">테스트할 사용자를 선택해주세요</p>
        
        <button class="refresh-btn" onclick="loadUsers()">사용자 목록 새로고침</button>
        
        <div class="user-selection" id="userSelection">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <span>사용자 목록을 불러오는 중...</span>
            </div>
        </div>
        
        <button class="login-btn" id="loginBtn" disabled>로그인</button>
        
        <div class="demo-note">
            <strong>데모 안내</strong>
            각 사용자별로 다른 멤버십 상태를 테스트할 수 있습니다:
            <ul>
                <li>베이직: 학습 기능만 사용 가능</li>
                <li>프리미엄: 모든 기능 사용 가능</li>
                <li>횟수제: 대화 기능 제한적 사용</li>
                <li>멤버십 없음: 구매 화면 표시</li>
            </ul>
        </div>
    </div>

    <script>
        let selectedUserId = null;
        let users = [];
        
        // 페이지 로드 시 사용자 목록 가져오기
        document.addEventListener('DOMContentLoaded', function() {
            loadUsers();
        });
        
        // 사용자 목록 API에서 가져오기
        async function loadUsers() {
            try {
                const response = await fetch('/api/v1/users');
                if (response.ok) {
                    users = await response.json();
                    displayUsers(users);
                } else {
                    // API가 없는 경우 fallback으로 직접 조회
                    await loadUsersDirectly();
                }
            } catch (error) {
                console.error('사용자 목록 로드 실패:', error);
                await loadUsersDirectly();
            }
        }
        
        // 직접 사용자 정보 조회 (fallback)
        async function loadUsersDirectly() {
            const userSelection = document.getElementById('userSelection');
            userSelection.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div><span>사용자 ID를 확인 중...</span></div>';
            
            // 각 사용자의 멤버십 상태를 개별 조회
            const testUsers = [];
            
            for (let id = 17; id <= 30; id++) {
                try {
                    const response = await fetch(`/api/v1/users/${id}/membership_status`);
                    if (response.ok) {
                        const data = await response.json();
                        let membershipInfo = '❌ 활성 멤버십 없음';
                        let membershipType = '없음';
                        
                        if (data.has_membership) {
                            const membership = data.membership;
                            membershipType = membership.name;
                            
                            if (membership.name.includes('베이직')) {
                                membershipInfo = '✅ 베이직 멤버십 (학습 기능)';
                            } else if (membership.name.includes('프리미엄')) {
                                membershipInfo = '⭐ 프리미엄 멤버십 (모든 기능)';
                            } else if (membership.name.includes('횟수제')) {
                                membershipInfo = '🎯 횟수제 멤버십 (대화 제한)';
                            }
                        }
                        
                        // 임시 사용자 정보 생성 (이메일은 추정)
                        const emailMap = {
                            '베이직': 'test@ringle.co.kr',
                            '프리미엄': 'premium@ringle.co.kr', 
                            '횟수제': 'usage@ringle.co.kr',
                            '없음': 'guest@example.com'
                        };
                        
                        const nameMap = {
                            '베이직': '테스트 사용자',
                            '프리미엄': '프리미엄 사용자',
                            '횟수제': '횟수제 사용자',
                            '없음': '멤버십 없음'
                        };
                        
                        testUsers.push({
                            id: id,
                            name: nameMap[membershipType] || `사용자 ${id}`,
                            email: emailMap[membershipType] || `user${id}@example.com`,
                            membership: membershipInfo
                        });
                    }
                } catch (error) {
                    // 사용자가 없으면 건너뛰기
                    continue;
                }
            }
            
            if (testUsers.length > 0) {
                displayUsers(testUsers);
            } else {
                userSelection.innerHTML = `
                    <div class="error-state">
                        <strong>⚠️ 사용자를 찾을 수 없습니다!</strong>
                        다음 명령어를 실행해주세요:<br>
                        <code>rails db:seed</code>
                    </div>
                `;
            }
        }
        
        // 사용자 목록 표시
        function displayUsers(userList) {
            const userSelection = document.getElementById('userSelection');
            
            if (userList.length === 0) {
                userSelection.innerHTML = `
                    <div class="error-state">
                        <strong>사용자가 없습니다.</strong>
                        <code>rails db:seed</code>를 실행해주세요.
                    </div>
                `;
                return;
            }
            
            userSelection.innerHTML = userList.map(user => `
                <div class="user-option" data-user-id="${user.id}">
                    <div class="user-name">${user.name}</div>
                    <div class="user-email">${user.email}</div>
                    <div class="user-membership">${user.membership}</div>
                </div>
            `).join('');
            
            // 클릭 이벤트 재등록
            setupUserSelection();
        }
        
        // 사용자 선택 이벤트 설정
        function setupUserSelection() {
            document.getElementById('userSelection').addEventListener('click', function(e) {
                const userOption = e.target.closest('.user-option');
                if (!userOption) return;
                
                // 기존 선택 해제
                document.querySelectorAll('.user-option').forEach(option => {
                    option.classList.remove('selected');
                });
                
                // 새로운 선택
                userOption.classList.add('selected');
                selectedUserId = userOption.getAttribute('data-user-id');
                
                // 로그인 버튼 활성화
                document.getElementById('loginBtn').disabled = false;
            });
        }
        
        // 로그인 버튼 클릭 처리
        document.getElementById('loginBtn').addEventListener('click', function() {
            if (selectedUserId === null) return;
            
            // localStorage에 선택된 사용자 ID 저장
            localStorage.setItem('currentUserId', selectedUserId);
            
            // 사용자 정보도 저장
            const selectedUser = users.find(u => u.id == selectedUserId) || 
                                 { name: `사용자 ${selectedUserId}`, email: `user${selectedUserId}@example.com` };
            localStorage.setItem('currentUserInfo', JSON.stringify(selectedUser));
            
            // 메인 페이지로 이동
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
